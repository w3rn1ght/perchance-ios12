<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Perchance · подготовка</title>
<style>
  html,body{margin:0;height:100%;background:#0b0d11;color:#e8e8e8;
    font:15px/1.45 -apple-system,system-ui,sans-serif;-webkit-user-select:none}
  #wrap{display:flex;align-items:center;justify-content:center;height:100%;padding:24px;box-sizing:border-box}
  .card{max-width:420px;width:100%;text-align:center}
  .logo{font-size:40px;line-height:1;margin-bottom:10px}
  h1{font-size:20px;margin:0 0 6px}
  p{color:#9aa4b2;margin:8px 0}
  .bar{height:6px;border-radius:3px;background:#1d222b;overflow:hidden;margin:18px 0 8px}
  .bar > i{display:block;height:100%;width:0;background:#2f6fe0;transition:width .25s}
  .err{color:#f87171;white-space:pre-wrap;text-align:left;font-size:12px;margin-top:12px}
  .btn{display:inline-block;margin-top:14px;padding:10px 18px;border-radius:10px;
    background:#2f6fe0;color:#fff;text-decoration:none;font-weight:600}
  .muted{font-size:12px;color:#6b7583}
</style>
</head>
<body>
<div id="wrap"><div class="card">
  <div class="logo">🎲</div>
  <h1>Perchance</h1>
  <p id="status">Готовлю переписывание JavaScript для iOS 12…</p>
  <div class="bar"><i id="fill"></i></div>
  <p class="muted" id="detail">Babel загружается один раз — дальше всё из кэша.</p>
  <div class="err" id="err"></div>
</div></div>

<script>
  var statusEl = document.getElementById('status');
  var detailEl = document.getElementById('detail');
  var fillEl = document.getElementById('fill');
  var errEl = document.getElementById('err');

  function fail(message) {
    statusEl.textContent = 'Не удалось подготовить страницу';
    errEl.textContent = String(message);
    detailEl.textContent = 'Закрой приложение и открой снова. Если не помогает — удали и переустанови.';
  }

  function loadSequence(urls, onEach, done) {
    var i = 0;
    function next() {
      if (i >= urls.length) { done(); return; }
      var url = urls[i++];
      onEach(url, i);
      var s = document.createElement('script');
      s.src = url;
      s.onload = next;
      s.onerror = function () {
        // сеть на iOS 12 бывает нестабильной — 2 повторные попытки
        if (!s.__retried) {
          s.__retried = true;
          setTimeout(function () {
            var again = document.createElement('script');
            again.src = url + '?r=' + Date.now();
            again.onload = next;
            again.onerror = function () { fail('не загрузился ' + url); };
            document.head.appendChild(again);
          }, 600);
        } else {
          fail('не загрузился ' + url);
        }
      };
      document.head.appendChild(s);
    }
    next();
  }

  var files = ['babel.min.js', 'transform-web.js', 'client-hooks.js', 'core-js-bundle.js', 'polyfills.js', 'legacy.js'];

  document.addEventListener('DOMContentLoaded', function () {
    loadSequence(files, function (url, n) {
      statusEl.textContent = 'Загрузка ' + n + ' из ' + files.length + '…';
      fillEl.style.width = Math.round((n - 1) / files.length * 100) + '%';
    }, function () {
      if (!window.Babel || !window.Babel.transform) { fail('Babel не инициализировался'); return; }
      if (!window.PCTransform) { fail('PCTransform не инициализировался'); return; }
      fillEl.style.width = '100%';
      statusEl.textContent = 'Готово';
      detailEl.textContent = 'Babel ' + (window.Babel.version || '') + ' · v' + PCTransform.VERSION;
      document.body.setAttribute('data-ready', '1');
      try {
        window.webkit.messageHandlers.pc.postMessage({ id: 0, ready: true });
      } catch (e) {}
    });
  });

  /* ---------------- API, которое вызывает нативное приложение --------------- */

  function reply(id, value) {
    try {
      window.webkit.messageHandlers.pc.postMessage({ id: id, value: value });
    } catch (e) {}
  }

  window.__pcCall = function (payload) {
    var f = payload && payload.f;
    var a = (payload && payload.a) || [];
    var id = payload && payload.id;
    try {
      if (f === 'transformJS') {
        reply(id, PCTransform.transformJS(a[0], { force: true }));
      } else if (f === 'patchCSS') {
        reply(id, PCTransform.patchCSS(a[0]));
      } else if (f === 'transformHTML') {
        reply(id, PCTransform.transformHTML(a[0]));
      } else if (f === 'version') {
        reply(id, { version: PCTransform.VERSION, babel: window.Babel && window.Babel.version });
      } else {
        reply(id, { ok: false, error: 'unknown function: ' + f });
      }
    } catch (e) {
      reply(id, { ok: false, error: String(e && e.message || e) });
    }
  };

  // Транспиляция HTML делает JS (быстро, без похода в native)
  window.__pcTransformHTML = function (html) {
    return PCTransform.transformHTML(html, { clientMarker: true });
  };
</script>
</body>
</html>
