name: Build Perchance.deb

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Прошлый релиз 1.1.11 содержал пакет 1.1.10: версию забыли поднять в
      # control/Info.plist. Теперь сборка падает, если версии расходятся или
      # тег не совпадает с версией.
      - name: Verify version consistency
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^Version:' perchance-client/control | awk '{print $2}' | tr -d '\r')
          PLIST_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" perchance-client/Resources/Info.plist | tr -d '\r')
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" perchance-client/Resources/Info.plist | tr -d '\r')
          echo "control=$VERSION plist=$PLIST_VERSION build=$BUILD ref=$GITHUB_REF"
          if [ -z "$VERSION" ] || [ "$VERSION" != "$PLIST_VERSION" ]; then
            echo "::error::Версия в control ($VERSION) не совпадает с Info.plist ($PLIST_VERSION)"
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/tags/v*)
              TAG="${GITHUB_REF#refs/tags/v}"
              if [ "$TAG" != "$VERSION" ]; then
                echo "::error::Тег v$TAG не совпадает с версией пакета $VERSION"
                exit 1
              fi
              ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install ldid and xz
        run: brew install ldid xz

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install iPhoneOS12.4 SDK
        run: |
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/theos-sdks
          cd /tmp/theos-sdks
          git sparse-checkout set iPhoneOS12.4.sdk
          mkdir -p "$THEOS/sdks"
          cp -R iPhoneOS12.4.sdk "$THEOS/sdks/"
          # Новый clang (Xcode 16) ругается на module.map как на ошибку
          # (-Wdeprecated-module-dot-map). Отключаем именно это предупреждение.
          echo 'ADDITIONAL_OBJCFLAGS = -Wno-deprecated-module-dot-map' >> "$THEOS/makefiles/common.mk"
          echo "--- SDK ---"; ls "$THEOS/sdks"

      - name: Build package
        run: |
          cd perchance-client
          set -o pipefail
          make package FINALPACKAGE=1 2>&1 | tee /tmp/build.log

      - name: Verify built package
        run: |
          set -euo pipefail
          EXPECTED="perchance-client/packages/com.w3rn1ght.perchance_${VERSION}_iphoneos-arm.deb"
          echo "Ожидаю пакет: $EXPECTED"
          ls -l perchance-client/packages/ || true
          if [ ! -f "$EXPECTED" ]; then
            echo "::error::Собранный .deb не соответствует версии $VERSION (см. список файлов выше)"
            exit 1
          fi

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: perchance-deb
          path: perchance-client/packages/*.deb
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: perchance-client/packages/*.deb
